# ---------------------------------------------------------------------------
# Supabase pauses a Free Plan project after 7 days without database activity,
# and a paused project needs a MANUAL restore from the dashboard — it does not
# wake on a request. A judge opening the link a week after submission would
# otherwise find a dead demo.
#
# One cheap read every three days resets that timer. GitHub Actions is free for
# public repositories, so this adds no paid dependency.
#
# Caveat worth knowing: GitHub disables scheduled workflows in a repository with
# no commits for 60 days. Fine for a submission window, not a production plan.
# ---------------------------------------------------------------------------
name: keep-warm

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY not set — skipping."
            exit 0
          fi
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            "$URL/rest/v1/drugs?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          [ "$code" = "200" ] || { cat /tmp/out; exit 1; }
